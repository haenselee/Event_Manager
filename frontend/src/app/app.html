<ng-container *ngIf="!currentUser; else mainApp">
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div>
          <h1>Event Management</h1>
        </div>
      </div>

      <div class="login-body">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #mainApp>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-text">
            <div class="brand-title">Event Verwaltung</div>
          </div>
        </div>

        <nav class="nav">
          <a
            class="nav-link"
            routerLink="/events"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Startseite
          </a>

          <a
            class="nav-link"
            routerLink="/calendar"
            routerLinkActive="active"
          >
            Kalender
          </a>

          <a
            class="nav-link"
            *ngIf="isStudent"
            routerLink="/my-registrations"
            routerLinkActive="active"
          >
            Meine Anmeldungen
          </a>

          <a
            class="nav-link"
            *ngIf="isTeacher || isAdmin"
            routerLink="/event-info"
            routerLinkActive="active"
          >
            Event-Infos
          </a>

          <a
            class="nav-link"
            *ngIf="isAdmin"
            routerLink="/admin"
            routerLinkActive="active"
          >
            Userverwaltung
          </a>
        </nav>

        <div class="user-area" *ngIf="currentUser">
          <div class="user-info">
            <span class="user-name">
              {{ currentUser?.username }} ({{ currentUser?.role }})
            </span>
            <button class="logout-btn" type="button" (click)="logout()">
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="page-section">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</ng-template>
