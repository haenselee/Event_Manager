<ng-container *ngIf="!currentUser; else mainApp">
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">🎓</div>
        <div>
          <h1>Event Management</h1>
          <p>Login für Lehrer und Schüler</p>
        </div>
      </div>

      <div class="login-body">
        <app-login></app-login>
      </div>
    </div>
  </div>
</ng-container>

<!-- Nach Login: Haupt-App -->
<ng-template #mainApp>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-icon">🎓</div>
          <div class="brand-text">
            <div class="brand-title">Event Verwaltung</div>
            <div class="brand-subtitle">Verwaltung von Events</div>
          </div>
        </div>

        <nav class="nav">
          <button
            class="nav-link"
            [ngClass]="{ active: activePage === 'events' }"
            (click)="setPage('events')"
          >
            Startseite
          </button>

          <button
            class="nav-link"
            [ngClass]="{ active: activePage === 'calendar' }"
            (click)="setPage('calendar')"
          >
            Kalender
          </button>

          <!-- Nur Schüler -->
          <button
            class="nav-link"
            *ngIf="isStudent"
            [ngClass]="{ active: activePage === 'my-registrations' }"
            (click)="setPage('my-registrations')"
          >
            Meine Anmeldungen
          </button>

          <!-- Nur Lehrer/Admin: Event-Infos -->
          <button
            class="nav-link"
            *ngIf="isTeacher || isAdmin"
            [ngClass]="{ active: activePage === 'event-info' }"
            (click)="setPage('event-info')"
          >
            Event-Infos
          </button>

          <!-- Nur Admin: Userverwaltung -->
          <button
            class="nav-link"
            *ngIf="isAdmin"
            [ngClass]="{ active: activePage === 'admin' }"
            (click)="setPage('admin')"
          >
            Userverwaltung
          </button>
        </nav>

        <div class="user-area" *ngIf="currentUser">
          <div class="user-info">
            <span class="user-name">
              {{ currentUser?.username }} ({{ currentUser?.role }})
            </span>
            <button class="logout-btn" type="button" (click)="logout()">
              <span class="logout-icon">⎋</span>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <!-- Startseite -->
      <section *ngIf="activePage === 'events'" class="page-section">
        <!-- Eine Komponente, die je nach Rolle anders aussieht -->
        <app-student-events (openChat)="onOpenChat($event)"></app-student-events>
      </section>

      <!-- Kalender -->
      <section *ngIf="activePage === 'calendar'" class="page-section">
        <app-calendar (goToEvents)="setPage('events')"></app-calendar>
      </section>

      <!-- Meine Anmeldungen -->
      <section *ngIf="activePage === 'my-registrations'" class="page-section">
        <app-my-registrations></app-my-registrations>
      </section>

      <!-- Event-Infos (Lehrer/Admin) -->
      <section *ngIf="activePage === 'event-info' && (isTeacher || isAdmin)" class="page-section">
        <app-event-overview (openChat)="onOpenChat($event)"></app-event-overview>
      </section>

      <!-- Userverwaltung (nur Admin) -->
      <section *ngIf="activePage === 'admin' && isAdmin" class="page-section">
        <app-admin></app-admin>
      </section>

      <!-- Chat-Forum zu einem Event -->
      <section *ngIf="activePage === 'event-chat' && selectedChatEvent" class="page-section">
        <app-event-chat [event]="selectedChatEvent"></app-event-chat>
      </section>
    </main>
  </div>
</ng-template>
