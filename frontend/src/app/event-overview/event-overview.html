<div class="overview-wrapper">
  <h2 class="page-title">Event-Infos</h2>

  <p *ngIf="loading">Lade Events…</p>
  <p *ngIf="error" class="error-text">{{ error }}</p>

  <div class="event-box" *ngFor="let ev of events">
    <header class="ev-header">
      <div>
        <h3>{{ ev.title }}</h3>
        <div class="meta">
          {{ ev.date | date:'dd.MM.yyyy' }} •
          <span *ngIf="ev.location">📍 {{ ev.location }}</span>
          <span *ngIf="ev.price && ev.price > 0"> • {{ ev.price }} €</span>
          <span *ngIf="!ev.price || ev.price === 0"> • Kostenlos</span>
        </div>
      </div>

      <button class="chat-btn"
              (click)="openChat.emit({ id: ev.id!, title: ev.title })">
        Chat-Forum
      </button>
      <button
        *ngIf="auth.isTeacher || auth.isAdmin"
        type="button"
        (click)="editEvent(ev)">
        Event bearbeiten
      </button>
      <button
        *ngIf="auth.isTeacher || auth.isAdmin"
        type="button"
        (click)="deleteEvent(ev.id)">
        Event löschen
      </button>
    </header>

    <div *ngIf="getRegistrations(ev.id!).length > 0; else noRegs">
      <table class="reg-table">
        <thead>
        <tr>
          <th>Schüler</th>
          <th>Bezahl-Status</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let r of getRegistrations(ev.id!)">
          <td>{{ r.student.username }}</td>
          <td>
            <span [class.paid]="r.paid" [class.unpaid]="!r.paid">
              {{ r.paid ? 'Bezahlt' : 'Offen' }}
            </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <ng-template #noRegs>
      <p class="empty">Noch keine Anmeldungen.</p>
    </ng-template>
  </div>
</div>
