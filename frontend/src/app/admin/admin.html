<div class="admin-wrapper">

  <h2 class="page-title">Userverwaltung</h2>

  <div class="admin-card">
    <h3>Neuen Benutzer anlegen</h3>

    <div class="admin-grid">
      <div>
        <label>Username</label>
        <input [(ngModel)]="username" placeholder="z. B. anna.schmidt" />
      </div>

      <div>
        <label>Passwort</label>
        <input [(ngModel)]="password" type="password" placeholder="Passwort" />
      </div>

      <div>
        <label>Rolle</label>
        <select [(ngModel)]="role">
          <option value="STUDENT">Schüler</option>
          <option value="TEACHER">Lehrer</option>
          <option value="ADMIN">Administrator</option>
        </select>
      </div>
    </div>

    <button class="primary-btn" (click)="createUser()">Benutzer erstellen</button>

    <p class="error" *ngIf="error">{{ error }}</p>
    <p class="success" *ngIf="success">{{ success }}</p>
  </div>

  <div class="admin-card">
    <h3>Bestehende Benutzer</h3>

    <table class="user-table">
      <thead>
      <tr>
        <th>
          <button type="button" class="sort-btn" (click)="setSort('id')">
            ID {{ getSortIndicator('id') }}
          </button>
        </th>
        <th>
          <button type="button" class="sort-btn" (click)="setSort('username')">
            Benutzername {{ getSortIndicator('username') }}
          </button>
        </th>
        <th>
          <button type="button" class="sort-btn" (click)="setSort('role')">
            Rolle {{ getSortIndicator('role') }}
          </button>
        </th>
        <th>Aktion</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let u of getSortedUsers()">
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.role }}</td>
        <td>
          <button
            class="delete-btn"
            type="button"
            (click)="deleteUser(u)"
            [disabled]="auth.currentUser?.id === u.id"
          >
            Löschen
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</div>
